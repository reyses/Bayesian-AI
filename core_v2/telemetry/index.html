<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayesian-AI Telemetry</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.4);
            --progress-bg: #21262d;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(88, 166, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(163, 113, 247, 0.05), transparent 25%);
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .metrics-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.5s ease-out backwards;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--accent);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .metric-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .metric-pct {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: var(--progress-bg);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 1rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58a6ff, #a371f7);
            border-radius: 6px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--accent-glow);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 2s infinite linear;
        }

        .metric-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value {
            color: var(--text-main);
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 2rem;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--card-border);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Connecting pulse indicator */
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #3fb950;
            box-shadow: 0 0 10px #3fb950;
            margin-right: 8px;
            animation: pulse-anim 2s infinite;
        }

        .pulse.disconnected {
            background-color: #f85149;
            box-shadow: 0 0 10px #f85149;
        }

        @keyframes pulse-anim {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(63, 185, 80, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Bayesian-AI Telemetry</h1>
        <p><span id="connection-indicator" class="pulse"></span><span id="connection-text">Live Monitoring Active</span></p>
    </div>

    <div class="metrics-container" id="metrics-container">
        <!-- Rendered via JS -->
    </div>

    <script>
        const container = document.getElementById('metrics-container');
        const connIndicator = document.getElementById('connection-indicator');
        const connText = document.getElementById('connection-text');

        function createCard(metric) {
            return `
                <div class="metric-card" id="card-${metric.metric_id}">
                    <div class="metric-header">
                        <div class="metric-title">${metric.label}</div>
                        <div class="metric-pct">${metric.pct.toFixed(1)}%</div>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${metric.pct}%"></div>
                    </div>
                    <div class="metric-stats">
                        <div class="stat-item">
                            <span>Progress:</span>
                            <span class="stat-value">${metric.current.toLocaleString()} / ${metric.total.toLocaleString()}</span>
                        </div>
                        <div class="stat-item">
                            <span>Speed:</span>
                            <span class="stat-value">${metric.vel_str}</span>
                        </div>
                        <div class="stat-item">
                            <span>ETA:</span>
                            <span class="stat-value">${metric.eta_str}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchMetrics() {
            try {
                const res = await fetch('/api/metrics');
                if (!res.ok) throw new Error("Network response was not ok");
                const metrics = await res.json();
                
                connIndicator.className = "pulse";
                connText.textContent = "Live Monitoring Active";

                if (metrics.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No active pipelines</h3>
                            <p>Waiting for TelemetryReporter to push data...</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                metrics.forEach((metric, index) => {
                    html += createCard(metric);
                });
                
                const existingCards = container.querySelectorAll('.metric-card');
                if (existingCards.length === metrics.length) {
                    metrics.forEach(metric => {
                        const card = document.getElementById(`card-${metric.metric_id}`);
                        if (card) {
                            card.querySelector('.metric-title').textContent = metric.label;
                            card.querySelector('.metric-pct').textContent = `${metric.pct.toFixed(1)}%`;
                            card.querySelector('.progress-fill').style.width = `${metric.pct}%`;
                            const statValues = card.querySelectorAll('.stat-value');
                            statValues[0].textContent = `${metric.current.toLocaleString()} / ${metric.total.toLocaleString()}`;
                            statValues[1].textContent = metric.vel_str;
                            statValues[2].textContent = metric.eta_str;
                        } else {
                            container.innerHTML = html;
                        }
                    });
                } else {
                    container.innerHTML = html;
                    container.querySelectorAll('.metric-card').forEach((card, i) => {
                        card.style.animationDelay = `${i * 0.1}s`;
                    });
                }

            } catch (err) {
                console.error("Failed to fetch metrics:", err);
                connIndicator.className = "pulse disconnected";
                connText.textContent = "Connection Lost";
            }
        }

        setInterval(fetchMetrics, 500);
        fetchMetrics();
    </script>
</body>
</html>
